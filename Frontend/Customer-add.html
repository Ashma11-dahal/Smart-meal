<!-- ============================================
     Add Customer Page
     Food Ordering System
     Component: Customer Management
     Purpose: Allows admin to add a new customer
     ============================================ -->

<!DOCTYPE html>
<html>
<head>
    <title>Add Customer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Add Customer</h1>

    <!-- Link back to customer list page -->
    <p>
        <a href="Customer-list.html">Back to Customer List</a>
    </p>

    <!-- Error message area for validation -->
    <p id="errorMessage" style="color:red;"></p>

    <!-- Add Customer Form -->
    <form id="addCustomerForm">

        <label>Customer Name:</label><br>
        <input type="text" id="customerName"><br><br>

        <label>Email:</label><br>
        <input type="email" id="email"><br><br>

        <label>Phone:</label><br>
        <input type="text" id="phone"><br><br>

        <label>Address:</label><br>
        <input type="text" id="address"><br><br>

        <label>Date Added:</label><br>
        <input type="date" id="dateAdded"><br><br>

        <label>Active:</label>
        <input type="checkbox" id="isActive" checked><br><br>

        <button type="submit">Add Customer</button>

    </form>

    <script>
        // Get the form from the page
        const form = document.getElementById("addCustomerForm");

        // Run validation when the form is submitted
        form.addEventListener("submit", function(event) {
            event.preventDefault();

            // Get values entered by admin
            const customerName = document.getElementById("customerName").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const address = document.getElementById("address").value.trim();
            const dateAdded = document.getElementById("dateAdded").value;
            const errorMessage = document.getElementById("errorMessage");

            let errors = "";

            // Validate customer name
            if (customerName === "") {
                errors += "Customer name is required.<br>";
            } else if (customerName.length > 50) {
                errors += "Customer name must be 50 characters or less.<br>";
            }

            // Validate email
            if (email === "") {
                errors += "Email is required.<br>";
            } else if (!email.includes("@")) {
                errors += "Email must contain @.<br>";
            } else if (email.length > 100) {
                errors += "Email must be 100 characters or less.<br>";
            }

            // Validate phone
            if (phone === "") {
                errors += "Phone number is required.<br>";
            } else if (phone.length > 15) {
                errors += "Phone number must be 15 characters or less.<br>";
            }

            // Validate address
            if (address === "") {
                errors += "Address is required.<br>";
            } else if (address.length > 100) {
                errors += "Address must be 100 characters or less.<br>";
            }

            // Validate date added
            if (dateAdded === "") {
                errors += "Date added is required.<br>";
            }

            // Display errors or success message
            if (errors !== "") {
                errorMessage.innerHTML = errors;
            } else {

    // Send customer data to backend API
    fetch("http://localhost:3000/customers", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            customer_name: customerName,
            email: email,
            phone: phone,
            address: address,
            is_active: document.getElementById("isActive").checked,
            date_added: dateAdded

        })

    })

    .then(response => response.json())

    .then(data => {

        errorMessage.style.color = "green";

        errorMessage.innerHTML = data.message;

        // Clear form after successful add
        form.reset();

    })

    .catch(error => {

        errorMessage.style.color = "red";

        errorMessage.innerHTML = "Error adding customer.";

        console.log(error);

    });

}
        });
    </script>

</body>
</html>
